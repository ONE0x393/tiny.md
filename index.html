<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>tiny.md — Markdown editor</title>
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>
  <header class="bar">
    <a class="brand" href="./" aria-label="tiny.md home"><span class="logo" aria-hidden="true">t<span>.</span></span><span>tiny<span class="accent">.</span>md</span></a>
    <div class="mode-switch" aria-label="Editing mode">
      <button id="live-mode" type="button" aria-pressed="true">Live</button>
      <button id="source-mode" type="button" aria-pressed="false">Source</button>
    </div>
    <div class="bar-actions" id="bar-actions" aria-label="Document actions">
      <button id="new-doc" type="button" title="New document">New</button>
      <button id="open-doc" type="button" title="Open Markdown (Ctrl/⌘ O), or drop a file here">Open</button>
      <button id="save-doc" type="button" class="save-button" title="Download Markdown (Ctrl/⌘ S)">Save</button>
      <input id="file-input" type="file" hidden accept=".md,.markdown,.mdown,.mkd,.txt,text/markdown,text/plain">
      <button id="theme" type="button" aria-label="Toggle color theme" title="Toggle color theme">◐</button>
    </div>
  </header>
  <main class="workspace" aria-label="Document workspace">
    <aside class="outline-panel" id="outline-panel" hidden>
      <div class="outline-label">OUTLINE</div>
      <nav id="outline-links" aria-label="Document outline"></nav>
    </aside>
    <div class="canvas">
      <div class="eyebrow"><span></span> <span id="filename">WRITING SPACE</span></div>
      <div class="editor-tools" aria-label="Editor controls">
        <button id="outline-toggle" aria-controls="outline-panel" aria-expanded="false" type="button">Outline</button>
        <div class="format-buttons" aria-label="Insert Markdown formatting">
          <button type="button" data-mark="**" title="Bold (Ctrl/⌘ B)" aria-label="Bold"><strong>B</strong></button>
          <button type="button" data-mark="*" title="Italic (Ctrl/⌘ I)" aria-label="Italic"><em>I</em></button>
          <button type="button" data-mark="`" title="Inline code" aria-label="Inline code">&lt;/&gt;</button>
          <button type="button" data-mark="~~" title="Strikethrough" aria-label="Strikethrough"><s>S</s></button>
        </div>
      </div>
      <div id="editor"></div>
    </div>
  </main>
  <footer class="status-bar">
    <span id="status" role="status" aria-live="polite">Markdown</span>
    <span id="metrics" aria-label="Document statistics"></span>
  </footer>
  <div id="drop-hint" class="drop-hint" aria-hidden="true" hidden><span>Drop to open a Markdown file</span></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
